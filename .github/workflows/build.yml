name: Build & Release APK

on:
  push:
    branches: [ "claude/ride-tracking-app-plan-wyzy6n" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" --sdk_root=$ANDROID_SDK_ROOT

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Rename APK with app name and version
        id: apk
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          APK_NAME="RidesTracker-v${VERSION_NAME}-debug.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/debug/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Delete existing release (if any)
        run: |
          gh release delete v1.0-debug --yes 2>/dev/null || true
          git push --delete origin v1.0-debug 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-debug
          name: "RidesTracker Debug APK"
          body: |
            ## RidesTracker Debug Build

            **Direct APK download — install on your Android device (8.0+)**

            ### What's included:
            - Live GPS ride tracking with OpenStreetMap (no API key needed)
            - Distance, speed, elevation tracking
            - Ride history saved locally
            - Maintenance tracker & fuel log
            - Crash detection + SOS alert
            - Weather overlay
            - Dark theme

            ### Install:
            1. Download the `.apk` file below
            2. On your Android phone: Settings → Security → Allow unknown sources
            3. Open the downloaded APK and tap Install
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
